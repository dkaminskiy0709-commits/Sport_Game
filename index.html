<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренировка</title>
    <!-- Подключаем Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили для всего приложения */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 360px;
            width: 100%;
        }
        /* Стили для персонажа */
        .character {
            font-size: 120px;
            line-height: 1.4;
            cursor: pointer;
            transition: transform 0.1s ease;
            display: inline-block;
            background: var(--tg-theme-bg-color, #f0f0f0);
            padding: 20px 40px;
            border-radius: 100px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
            width: fit-content;
        }
        .character:active {
            transform: scale(0.92);
        }
        /* Стили для счётчиков */
        .stats {
            background: var(--tg-theme-bg-color, #f5f5f5);
            padding: 20px;
            border-radius: 20px;
            margin: 15px 0;
            width: 100%;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--tg-theme-hint-color, #ccc);
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-label {
            font-weight: 500;
            color: var(--tg-theme-hint-color, #666);
        }
        .stat-value {
            font-weight: 700;
            font-size: 1.2em;
        }
        /* Стили для меню улучшений */
        .upgrade-section {
            background: var(--tg-theme-bg-color, #f5f5f5);
            padding: 15px;
            border-radius: 20px;
            margin: 15px 0;
            width: 100%;
        }
        .upgrade-title {
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 12px;
            color: var(--tg-theme-text-color, #000);
        }
        .upgrade-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--tg-theme-hint-color, #ddd);
        }
        .upgrade-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }
        .upgrade-name {
            font-weight: 600;
            font-size: 0.95em;
        }
        .upgrade-desc {
            font-size: 0.8em;
            color: var(--tg-theme-hint-color, #666);
        }
        .upgrade-cost {
            font-weight: 700;
            font-size: 0.9em;
            color: var(--tg-theme-accent-text-color, #ff9500);
            margin-right: 10px;
        }
        .upgrade-btn {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            min-width: 60px;
            transition: opacity 0.2s;
        }
        .upgrade-btn:active {
            opacity: 0.7;
        }
        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        button {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active {
            opacity: 0.8;
        }
        .level-up {
            color: var(--tg-theme-accent-text-color, #ff9500);
            font-weight: 700;
            margin-top: 10px;
            min-height: 2em;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            background: var(--tg-theme-bg-color, #eee);
            color: var(--tg-theme-text-color, #333);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️ Тренировка</h1>
        <!-- Кликабельный персонаж -->
        <div class="character" id="character">🧑</div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">💪 Сила</span>
                <span class="stat-value" id="strength">1</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">🌟 Уровень</span>
                <span class="stat-value" id="level">1</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">📊 Опыт (XP)</span>
                <span class="stat-value" id="xp">0 / 100</span>
            </div>
            <div class="stat-item" style="border-bottom: none;">
                <span class="stat-label">🪙 Очки улучшений</span>
                <span class="stat-value" id="upgradePoints">0</span>
            </div>
        </div>

        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="main">🏠 Главная</button>
            <button class="tab-btn" data-tab="upgrades">⬆️ Улучшения</button>
        </div>

        <!-- Вкладка "Главная" -->
        <div class="tab-content active" id="tab-main">
            <div class="level-up" id="levelUpMessage">Нажми на человечка, чтобы начать!</div>
            <button id="resetButton">🔄 Начать заново</button>
        </div>

        <!-- Вкладка "Улучшения" -->
        <div class="tab-content" id="tab-upgrades">
            <div class="upgrade-section">
                <div class="upgrade-title">⬆️ Улучши своего персонажа</div>
                
                <div class="upgrade-item">
                    <div class="upgrade-info">
                        <span class="upgrade-name">⚡ Скорость клика</span>
                        <span class="upgrade-desc">+1 XP за клик</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="upgrade-cost" id="clickCost">5</span>
                        <button class="upgrade-btn" id="upgradeClick">Купить</button>
                    </div>
                </div>

                <div class="upgrade-item">
                    <div class="upgrade-info">
                        <span class="upgrade-name">🏋️ Множитель силы</span>
                        <span class="upgrade-desc">+2 силы за клик</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="upgrade-cost" id="powerCost">10</span>
                        <button class="upgrade-btn" id="upgradePower">Купить</button>
                    </div>
                </div>

                <div class="upgrade-item">
                    <div class="upgrade-info">
                        <span class="upgrade-name">💎 Бонусный опыт</span>
                        <span class="upgrade-desc">+50% к получаемому XP</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="upgrade-cost" id="bonusCost">20</span>
                        <button class="upgrade-btn" id="upgradeBonus">Купить</button>
                    </div>
                </div>

                <div style="margin-top: 12px; font-size: 0.85em; color: var(--tg-theme-hint-color, #666);">
                    🪙 Очки улучшений: <span id="upgradePointsBottom">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Игровая логика ---

        let game = {
            strength: 1,
            level: 1,
            xp: 0,
            xpToNextLevel: 100,
            // Новые поля для улучшений
            upgradePoints: 0,
            clickBonus: 0,      // Дополнительный XP за клик
            powerBonus: 0,      // Дополнительная сила за клик
            xpMultiplier: 1,    // Множитель XP (1.5 = +50%)
            // Стоимость улучшений (растет с каждым уровнем)
            clickCost: 5,
            powerCost: 10,
            bonusCost: 20,
            clickLevel: 0,
            powerLevel: 0,
            bonusLevel: 0
        };

        // Элементы
        const characterEl = document.getElementById('character');
        const strengthEl = document.getElementById('strength');
        const levelEl = document.getElementById('level');
        const xpEl = document.getElementById('xp');
        const messageEl = document.getElementById('levelUpMessage');
        const upgradePointsEl = document.getElementById('upgradePoints');
        const upgradePointsBottomEl = document.getElementById('upgradePointsBottom');
        const clickCostEl = document.getElementById('clickCost');
        const powerCostEl = document.getElementById('powerCost');
        const bonusCostEl = document.getElementById('bonusCost');
        const upgradeClickBtn = document.getElementById('upgradeClick');
        const upgradePowerBtn = document.getElementById('upgradePower');
        const upgradeBonusBtn = document.getElementById('upgradeBonus');

        // --- Вкладки ---
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
            });
        });

        // --- Сохранение ---
        function saveGame() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.CloudStorage.setItem('gameData', JSON.stringify(game));
            }
        }

        function loadGame() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.CloudStorage.getItem('gameData', (err, data) => {
                    if (!err && data) {
                        try {
                            const saved = JSON.parse(data);
                            game = saved;
                            updateUI();
                            updateUpgradeUI();
                        } catch(e) {}
                    }
                });
            }
        }

        // --- Обновление интерфейса ---
        function updateUI() {
            strengthEl.textContent = game.strength;
            levelEl.textContent = game.level;
            xpEl.textContent = `${game.xp} / ${game.xpToNextLevel}`;
            upgradePointsEl.textContent = game.upgradePoints;
            upgradePointsBottomEl.textContent = game.upgradePoints;
            
            if (game.strength >= 50) {
                characterEl.textContent = '🦸‍♂️';
            } else if (game.strength >= 20) {
                characterEl.textContent = '🦾';
            } else if (game.strength >= 10) {
                characterEl.textContent = '💪';
            } else {
                characterEl.textContent = '🧑';
            }
        }

        function updateUpgradeUI() {
            clickCostEl.textContent = game.clickCost;
            powerCostEl.textContent = game.powerCost;
            bonusCostEl.textContent = game.bonusCost;
            
            upgradeClickBtn.disabled = game.upgradePoints < game.clickCost;
            upgradePowerBtn.disabled = game.upgradePoints < game.powerCost;
            upgradeBonusBtn.disabled = game.upgradePoints < game.bonusCost;
        }

        // --- Повышение уровня ---
        function checkLevelUp() {
            if (game.xp >= game.xpToNextLevel) {
                game.level++;
                game.strength += 2;
                game.upgradePoints += 3; // +3 очка улучшений за уровень
                game.xp = 0;
                game.xpToNextLevel = Math.floor(game.xpToNextLevel * 1.5);
                messageEl.textContent = `🎉 УРОВЕНЬ ${game.level} ДОСТИГНУТ! +2 силы, +3 очка!`;
                messageEl.style.color = 'var(--tg-theme-accent-text-color, #ff9500)';
                
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
                }
                
                updateUI();
                updateUpgradeUI();
                saveGame();
                
                setTimeout(() => {
                    messageEl.textContent = 'Продолжай тренироваться! 💪';
                }, 3000);
            }
        }

        // --- Улучшения ---
        function buyUpgrade(type) {
            let cost, levelKey, costKey;
            if (type === 'click') {
                cost = game.clickCost;
                levelKey = 'clickLevel';
                costKey = 'clickCost';
            } else if (type === 'power') {
                cost = game.powerCost;
                levelKey = 'powerLevel';
                costKey = 'powerCost';
            } else if (type === 'bonus') {
                cost = game.bonusCost;
                levelKey = 'bonusLevel';
                costKey = 'bonusCost';
            }

            if (game.upgradePoints < cost) {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                }
                return;
            }

            game.upgradePoints -= cost;
            game[levelKey] = (game[levelKey] || 0) + 1;
            
            // Применяем эффект
            if (type === 'click') {
                game.clickBonus += 1;
                game.clickCost = Math.floor(game.clickCost * 1.6);
                messageEl.textContent = `⚡ Скорость клика +1!`;
            } else if (type === 'power') {
                game.powerBonus += 2;
                game.powerCost = Math.floor(game.powerCost * 1.6);
                messageEl.textContent = `🏋️ Сила за клик +2!`;
            } else if (type === 'bonus') {
                game.xpMultiplier = Math.min(game.xpMultiplier + 0.5, 5);
                game.bonusCost = Math.floor(game.bonusCost * 1.8);
                messageEl.textContent = `💎 Бонус XP теперь x${game.xpMultiplier.toFixed(1)}!`;
            }

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }

            updateUI();
            updateUpgradeUI();
            saveGame();

            setTimeout(() => {
                messageEl.textContent = 'Продолжай тренироваться! 💪';
            }, 2000);
        }

        upgradeClickBtn.addEventListener('click', () => buyUpgrade('click'));
        upgradePowerBtn.addEventListener('click', () => buyUpgrade('power'));
        upgradeBonusBtn.addEventListener('click', () => buyUpgrade('bonus'));

        // --- Клик по персонажу ---
        characterEl.addEventListener('click', function(e) {
            const baseGain = 1 + game.clickBonus;
            const strengthGain = 1 + game.powerBonus;
            let xpGain = Math.floor((baseGain + Math.floor(game.strength / 5)) * game.xpMultiplier);
            
            game.xp += xpGain;
            game.strength += strengthGain;
            
            this.style.transform = 'scale(0.85)';
            setTimeout(() => { this.style.transform = 'scale(1)'; }, 150);
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            
            checkLevelUp();
            updateUI();
            updateUpgradeUI();
            saveGame();
            
            messageEl.textContent = `+${xpGain} XP, +${strengthGain} сила!`;
            messageEl.style.color = 'var(--tg-theme-text-color, #000)';
        });

        // --- Кнопка сброса ---
        document.getElementById('resetButton').addEventListener('click', function() {
            if (confirm('Точно начать заново? Весь прогресс будет потерян.')) {
                game = {
                    strength: 1,
                    level: 1,
                    xp: 0,
                    xpToNextLevel: 100,
                    upgradePoints: 0,
                    clickBonus: 0,
                    powerBonus: 0,
                    xpMultiplier: 1,
                    clickCost: 5,
                    powerCost: 10,
                    bonusCost: 20,
                    clickLevel: 0,
                    powerLevel: 0,
                    bonusLevel: 0
                };
                messageEl.textContent = 'Прогресс сброшен. Начинай сначала!';
                updateUI();
                updateUpgradeUI();
                saveGame();
                
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('warning');
                }
            }
        });

        // --- Инициализация ---
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        
        loadGame();
        updateUpgradeUI();
    </script>
</body>
</html>
